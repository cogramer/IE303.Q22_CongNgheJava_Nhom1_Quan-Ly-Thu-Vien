<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>T&#224;i kho&#7843;n th&#7911; th&#432; - HCMC Lib</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
    <main class="librarian-profile-shell">
        <div th:replace="~{fragments/librarian-sidebar :: sidebar('profile')}"></div>

        <section class="profile-content">
            <section class="profile-hero profile-card">
                <div>
                    <p class="eyebrow">T&#224;i kho&#7843;n</p>
                    <h1>Th&#244;ng tin th&#7911; th&#432;</h1>
                    <p>Qu&#7843;n l&#253; th&#244;ng tin c&#225; nh&#226;n v&#224; m&#7853;t kh&#7849;u &#273;&#259;ng nh&#7853;p.</p>
                </div>
            </section>

            <section class="profile-grid">
                <article class="profile-card">
                    <h2 class="h5 mb-3">Th&#244;ng tin c&#225; nh&#226;n</h2>

                    <div th:if="${param.success}" class="alert alert-success">
                        C&#7853;p nh&#7853;t th&#244;ng tin th&#224;nh c&#244;ng.
                    </div>

                    <form th:action="@{/librarian/profile/update}" method="post" th:object="${user}">
                        <div class="mb-3">
                            <label class="form-label" for="username">T&#234;n &#273;&#259;ng nh&#7853;p</label>
                            <input id="username" class="form-control" th:field="*{username}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="fullName">H&#7885; t&#234;n</label>
                            <input id="fullName" class="form-control" th:field="*{fullName}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="email">Email</label>
                            <input id="email" class="form-control" type="email" th:field="*{email}" required>
                        </div>

                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-check2-circle"></i>
                            L&#432;u thay &#273;&#7893;i
                        </button>
                    </form>
                </article>

                <article class="profile-card">
                    <h2 class="h5 mb-3">&#272;&#7893;i m&#7853;t kh&#7849;u</h2>
                    <div id="password-message"></div>

                    <form id="change-password-form">
                        <div class="mb-3">
                            <label class="form-label" for="oldPassword">M&#7853;t kh&#7849;u hi&#7879;n t&#7841;i</label>
                            <input id="oldPassword" class="form-control" type="password" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="newPassword">M&#7853;t kh&#7849;u m&#7899;i</label>
                            <input id="newPassword" class="form-control" type="password" minlength="6" required>
                        </div>

                        <button id="change-password-btn" class="btn btn-outline-primary" type="submit">
                            <i class="bi bi-shield-lock"></i>
                            &#272;&#7893;i m&#7853;t kh&#7849;u
                        </button>
                    </form>
                </article>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/library.js}"></script>
    <script>
        document.getElementById("change-password-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("change-password-btn");
            const message = document.getElementById("password-message");
            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;

            button.disabled = true;
            button.textContent = "Dang doi...";
            message.innerHTML = "";

            try {
                const response = await fetch("/librarian/change-password", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                const data = await LibraryUI.readJson(response);
                if (!response.ok) {
                    throw new Error(data?.message || "Doi mat khau that bai.");
                }

                window.location.href = "/librarian/profile?success=true";
            } catch (error) {
                message.innerHTML = `<div class="alert alert-danger">${LibraryUI.escapeHtml(error.message)}</div>`;
            } finally {
                button.disabled = false;
                button.innerHTML = '<i class="bi bi-shield-lock"></i> &#272;&#7893;i m&#7853;t kh&#7849;u';
            }
        });
    </script>
</body>
</html>
