<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá sách - HCMC Lib</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/library.css}">
    <link rel="stylesheet" th:href="@{/css/feedback.css}">
</head>

<body>
    <div th:replace="fragments/header :: header"></div>

    <nav aria-label="breadcrumb" class="breadcrumb-section">
        <div class="container">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Đánh giá sách</li>
            </ol>
        </div>
    </nav>

    <main class="container feedback-container">
        <div class="page-heading mb-5">
            <h1 class="page-title mb-2">ĐÁNH GIÁ SÁCH</h1>
            <p class="text-muted mb-0">Gửi đánh giá, bình luận và xem lại các đánh giá sách bạn đã tạo</p>
        </div>

        <section class="filter-section feedback-form-section mb-4">
            <div class="table-header mb-3">
                <h3 class="h5">Thêm đánh giá mới</h3>
            </div>

            <form id="feedback-form" class="row g-3 align-items-end">
                <div class="col-lg-6">
                    <label for="feedback-book" class="form-label">Sách</label>
                    <select id="feedback-book" class="form-select" required>
                        <option value="">Đang tải danh sách sách...</option>
                    </select>
                </div>

                <div class="col-lg-6">
                    <label for="feedback-score" class="form-label">Mức đánh giá</label>
                    <select id="feedback-score" class="form-select" required>
                        <option value="5">5 - Rất hay</option>
                        <option value="4">4 - Hay</option>
                        <option value="3">3 - Ổn</option>
                        <option value="2">2 - Chưa phù hợp</option>
                        <option value="1">1 - Không thích</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="feedback-comment" class="form-label">Bình luận</label>
                    <textarea id="feedback-comment" class="form-control feedback-comment-input" rows="3"
                        maxlength="1000" placeholder="Nhập cảm nhận của bạn về cuốn sách..."></textarea>
                </div>
                <div class="col-lg-2 ms-auto mt-4">
                    <button id="feedback-submit" class="btn btn-primary w-100" type="submit">
                        Gửi đánh giá
                    </button>
                </div>
            </form>

        </section>

        <section class="table-section">
            <div class="table-header mb-3">
                <h3 class="h5">Danh sách đánh giá đã gửi</h3>
                <span class="record-count text-muted">
                    Tổng: <span id="totalFeedbackCount">0</span> đánh giá
                </span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle feedback-table mb-0">
                    <thead class="table-header-custom">
                        <tr>
                            <th scope="col" class="col-stt">STT</th>
                            <th scope="col" class="col-book">Sách</th>
                            <th scope="col" class="col-score">Đánh giá</th>
                            <th scope="col" class="col-comment">Bình luận</th>
                            <th scope="col" class="col-date">Ngày gửi</th>
                            <th scope="col" class="col-action">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="feedbackTableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="feedbackEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content feedback-modal">
                <form id="feedback-edit-form">
                    <div class="modal-header">
                        <h5 class="modal-title">Sửa đánh giá</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit-feedback-id">

                        <div class="mb-3">
                            <label class="form-label">Sách</label>
                            <input id="edit-feedback-book-title" class="form-control" type="text" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="edit-feedback-score" class="form-label">Mức đánh giá</label>
                            <select id="edit-feedback-score" class="form-select" required>
                                <option value="5">5 - Rất hay</option>
                                <option value="4">4 - Hay</option>
                                <option value="3">3 - Ổn</option>
                                <option value="2">2 - Chưa phù hợp</option>
                                <option value="1">1 - Không thích</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="edit-feedback-comment" class="form-label">Bình luận</label>
                            <textarea id="edit-feedback-comment" class="form-control feedback-comment-input" rows="4"
                                maxlength="1000"></textarea>
                        </div>

                        <div id="feedback-edit-message" class="feedback-message" aria-live="polite"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button id="feedback-edit-submit" type="submit" class="btn btn-primary">Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="feedbackDeleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content feedback-modal">
                <div class="modal-header">
                    <h5 class="modal-title">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="delete-feedback-id">
                    <p class="mb-1">Bạn có chắc muốn xóa đánh giá cho sách này?</p>
                    <strong id="delete-feedback-book-title"></strong>
                    <div id="feedback-delete-message" class="feedback-message" aria-live="polite"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button id="feedback-delete-confirm" type="button" class="btn btn-danger">Xóa đánh giá</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/library.js}"></script>
    <script th:src="@{/js/feedback.js}"></script>
</body>

</html>
