<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${book.title + ' - HCMC Lib'}">Chi tiết sách - HCMC Lib</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/books.css}">
</head>

<body>
    <div th:replace="fragments/header :: header"></div>

    <main class="book-detail-page">
        <section class="book-detail-shell">
            <a class="btn btn-outline-primary back-link" th:href="@{/reader/books}" aria-label="Quay lại danh sách">
                &#8249;
            </a>

            <div class="book-detail-card">
                <div class="book-detail-cover">
                    <img th:src="${book.imageUrl != null} ? @{${book.imageUrl}} : @{/img/banner_1.jpg}"
                        th:alt="${book.title}">
                </div>

                <div class="book-detail-content">
                    <span class="book-detail-badge" th:classappend="${book.availableCopies <= 0} ? ' is-muted'"
                        th:text="${book.availableCopies > 0 ? 'Còn sách' : 'Hết sách'}">Còn sách</span>

                    <h1 th:text="${book.title}">Tên sách</h1>
                    <p class="book-detail-author" th:text="${book.author}">Tác giả</p>

                    <div class="book-detail-grid">
                        <div>
                            <span>Thể loại</span>
                            <strong th:text="${book.categoryName != null ? book.categoryName : 'Chưa phân loại'}">Thể loại</strong>
                        </div>
                        <div>
                            <span>ISBN</span>
                            <strong th:text="${book.isbn != null ? book.isbn : 'Chưa cập nhật'}">ISBN</strong>
                        </div>
                        <div>
                            <span>Kho</span>
                            <strong th:text="${book.availableCopies + '/' + book.totalCopies + ' cuốn'}">0/0 cuốn</strong>
                        </div>
                        <div>
                            <span>Giá</span>
                            <strong th:text="${book.price != null ? book.price + 'đ' : 'Miễn phí'}">Giá</strong>
                        </div>
                    </div>

                    <div id="book-detail-message"></div>

                    <button id="reserve-detail-btn" class="btn btn-primary reserve-detail-btn" type="button"
                        th:data-book-id="${book.id}" th:disabled="${book.availableCopies <= 0}">
                        Đặt giữ sách
                    </button>
                </div>
            </div>

            <section class="book-reviews-section" th:data-book-id="${book.id}">
                <div class="book-reviews-header">
                    <div>
                        <h2>Đánh giá</h2>
                        <p>Xem cảm nhận của độc giả về cuốn sách này.</p>
                    </div>
                    <div class="book-reviews-summary">
                        <strong><span id="book-average-score">-</span> <span class="book-average-star">&#9733;</span></strong>
                        <span id="book-review-count">0 đánh giá</span>
                    </div>
                </div>

                <div id="book-reviews-list" class="book-reviews-list">
                    <div class="book-reviews-loading">Đang tải đánh giá...</div>
                </div>

                <nav id="book-reviews-pagination" class="book-reviews-pagination" aria-label="Phân trang đánh giá sách" hidden>
                    <button id="book-reviews-prev" class="btn btn-outline-primary btn-sm" type="button">Trước</button>
                    <span id="book-reviews-page-info">Trang 1 / 1</span>
                    <button id="book-reviews-next" class="btn btn-outline-primary btn-sm" type="button">Sau</button>
                </nav>

                <form id="book-review-form" class="book-review-form">
                    <div class="book-review-form-header">
                        <div>
                            <h3>Viết đánh giá của bạn</h3>
                            <p>Chia sẻ cảm nhận để độc giả khác tham khảo.</p>
                        </div>
                        <button id="book-review-submit" class="btn btn-primary" type="submit">Gửi đánh giá</button>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-9">
                            <label for="book-review-comment" class="form-label">Bình luận</label>
                            <textarea id="book-review-comment" class="form-control" rows="1" maxlength="1000"
                                placeholder="Nhập cảm nhận của bạn về cuốn sách..."></textarea>
                        </div>
                        <div class="col-md-3">
                            <label for="book-review-score" class="form-label">Điểm đánh giá</label>
                            <select id="book-review-score" class="form-select" required>
                                <option value="5">5 - Rất hay</option>
                                <option value="4">4 - Hay</option>
                                <option value="3">3 - Ổn</option>
                                <option value="2">2 - Chưa phù hợp</option>
                                <option value="1">1 - Không thích</option>
                            </select>
                        </div>
                    </div>
                </form>
            </section>
        </section>
    </main>

    <div class="modal fade" id="bookReviewEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content book-review-modal">
                <form id="book-review-edit-form">
                    <div class="modal-header">
                        <h5 class="modal-title">Sửa đánh giá</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit-book-review-id">
                        <div class="mb-3">
                            <label for="edit-book-review-score" class="form-label">Điểm đánh giá</label>
                            <select id="edit-book-review-score" class="form-select" required>
                                <option value="5">5 - Rất hay</option>
                                <option value="4">4 - Hay</option>
                                <option value="3">3 - Ổn</option>
                                <option value="2">2 - Chưa phù hợp</option>
                                <option value="1">1 - Không thích</option>
                            </select>
                        </div>
                        <div>
                            <label for="edit-book-review-comment" class="form-label">Bình luận</label>
                            <textarea id="edit-book-review-comment" class="form-control" rows="4" maxlength="1000"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button id="book-review-edit-submit" type="submit" class="btn btn-primary">Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/library.js}"></script>
    <script th:src="@{/js/book-detail.js}"></script>
</body>

</html>
