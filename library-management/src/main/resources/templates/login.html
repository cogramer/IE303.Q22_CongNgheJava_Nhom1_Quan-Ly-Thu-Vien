<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Hệ thống Thư viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-body">

    <div class="auth-card">

        <div class="auth-title">Đăng nhập</div>

        <!-- Bắt lỗi từ Spring Security (Mặc định khi lỗi sẽ redirect về /login?error) -->
        <div th:if="${param.error}" class="alert alert-danger">
            Tên đăng nhập hoặc mật khẩu không đúng!
        </div>

        <!-- Hiển thị thông báo khi người dùng đăng xuất thành công (/login?logout) -->
        <div th:if="${param.logout}" class="alert alert-success">
            Bạn đã đăng xuất thành công.
        </div>

        <!-- Đổi thành form submit POST chuẩn của Spring Security -->
        <form th:action="@{/login}" method="post">

            <div class="input-group custom-input">
                <!-- Bắt buộc phải có name="username" -->
                <input type="text" id="username" name="username" class="form-control" placeholder="Tên đăng nhập"
                    required>
                <i class="bi bi-person-fill"></i>
            </div>

            <div class="input-group custom-input">
                <!-- Bắt buộc phải có name="password" -->
                <input type="password" id="password" name="password" class="form-control" placeholder="Mật khẩu"
                    required>
                <i class="bi bi-lock-fill"></i>
            </div>

            <div class="d-flex justify-content-between extra-options mb-3">
                <label>
                    <!-- Tên mặc định của Spring Security cho Remember Me là "remember-me" -->
                    <input type="checkbox" id="rememberMeCheckBox" name="remember-me"> Nhớ mật khẩu
                </label>
                <!-- Khớp với WebAuthController: GET /forgot-password -->
                <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
            </div>

            <button class="auth-btn" type="submit">Đăng nhập</button>

        </form>

        <div class="text-center auth-footer-text">
            Chưa có tài khoản?
            <!-- Khớp với WebAuthController: GET /register -->
            <a th:href="@{/register}">Đăng ký ngay</a>
        </div>

    </div>

</body>

</html>
